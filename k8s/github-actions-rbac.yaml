apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: agricloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer-role
  namespace: agricloud
rules:
  - apiGroups: ["", "apps", "networking.k8s.io"]
    resources: ["pods", "services", "deployments", "ingresses", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer-binding
  namespace: agricloud
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: agricloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer-role